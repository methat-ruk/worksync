name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-review-evidence:
    name: PR review evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Self-test PR evidence checker
        run: node scripts/pr-review-evidence-self-test.cjs

      - name: Check PR evidence
        run: node scripts/pr-review-evidence.cjs

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worksync_test
          POSTGRES_USER: worksync
          POSTGRES_PASSWORD: worksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksync -d worksync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://worksync:worksync@localhost:5432/worksync_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
      AUTH_RATE_LIMIT_ENABLED: "true"
      AUTH_RATE_LIMIT_KEY_SECRET: ci-rate-limit-secret-at-least-32-bytes
      S3_REGION: us-east-1
      S3_BUCKET: worksync-test
      S3_ACCESS_KEY_ID: worksync
      S3_SECRET_ACCESS_KEY: worksync-local-secret
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          # Avoid npm's implicit audit of the pnpm bootstrap tool, not the project gate.
          npm_config_audit: "false"
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: >-
          docker run --detach --rm --name worksync-ci-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=worksync
          --env MINIO_ROOT_PASSWORD=worksync-local-secret
          minio/minio:RELEASE.2024-06-29T01-20-47Z
          server /data

      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs worksync-ci-minio
          exit 1

      - name: Apply Prisma migrations
        run: pnpm prisma:migrate:deploy:test

      - name: Validate backend
        run: pnpm validate:backend

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          npm_config_audit: "false"
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: app/frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-prod-v2-node22-api-local4000-googleoff-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'tsconfig.base.json', 'app/frontend/package.json', 'app/frontend/tsconfig.json', 'app/frontend/next.config.mjs', 'app/frontend/postcss.config.mjs', 'packages/auth-policy/package.json', 'packages/auth-policy/tsconfig.json') }}-${{ hashFiles('app/frontend/src/**', 'packages/auth-policy/src/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-prod-v2-node22-api-local4000-googleoff-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'tsconfig.base.json', 'app/frontend/package.json', 'app/frontend/tsconfig.json', 'app/frontend/next.config.mjs', 'app/frontend/postcss.config.mjs', 'packages/auth-policy/package.json', 'packages/auth-policy/tsconfig.json') }}-

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: pnpm validate:frontend

  frontend-e2e-compatibility:
    name: Frontend E2E compatibility
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 20
    env:
      HOME: /root
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          npm_config_audit: "false"
        with:
          run_install: false

      # This image lacks zstd. A cold gzip pnpm cache save took 39-43s,
      # versus a 15s frozen install; do not pay that cost on any E2E lane.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend runtime compatibility tests
        id: compatibility
        run: pnpm --filter @worksync/frontend test:e2e:compatibility

      - name: Upload compatibility results
        if: ${{ !cancelled() && (steps.compatibility.outcome == 'success' || steps.compatibility.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compatibility-results
          path: app/frontend/test-results/compatibility/junit.xml
          if-no-files-found: error
          retention-days: 7

  frontend-e2e-mocked:
    name: Frontend E2E mocked journeys
    runs-on: ubuntu-latest
    container:
      # Keep this tag aligned with the @playwright/test version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 20
    env:
      HOME: /root
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          npm_config_audit: "false"
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend end-to-end tests
        id: mocked
        run: pnpm --filter @worksync/frontend test:e2e

      - name: Upload mocked journey results
        if: ${{ !cancelled() && (steps.mocked.outcome == 'success' || steps.mocked.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mocked-results
          path: app/frontend/test-results/mocked/junit.xml
          if-no-files-found: error
          retention-days: 7

  frontend-e2e-live:
    name: Frontend E2E live auth
    runs-on: ubuntu-latest
    container:
      # Keep this tag aligned with the @playwright/test version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worksync_test
          POSTGRES_USER: worksync
          POSTGRES_PASSWORD: worksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksync -d worksync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOME: /root
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
      DATABASE_URL: postgresql://worksync:worksync@postgres:5432/worksync_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          npm_config_audit: "false"
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared auth policy
        run: pnpm --filter @worksync/auth-policy build

      - name: Apply Prisma migrations for live auth E2E
        run: pnpm prisma:migrate:deploy:test

      - name: Run live auth concurrency end-to-end tests
        id: live
        run: pnpm --filter @worksync/frontend test:e2e:live

      - name: Upload live auth results
        if: ${{ !cancelled() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-results
          path: app/frontend/test-results/live/junit.xml
          if-no-files-found: error
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E
    needs: [frontend-e2e-compatibility, frontend-e2e-mocked, frontend-e2e-live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-test E2E result gate
        run: node --test scripts/ci-e2e-result-self-test.cjs

      - name: Require every E2E lane to succeed
        env:
          COMPATIBILITY_RESULT: ${{ needs.frontend-e2e-compatibility.result }}
          MOCKED_RESULT: ${{ needs.frontend-e2e-mocked.result }}
          LIVE_RESULT: ${{ needs.frontend-e2e-live.result }}
        run: node scripts/ci-e2e-result.cjs "$COMPATIBILITY_RESULT" "$MOCKED_RESULT" "$LIVE_RESULT"

  containers:
    name: Container topology and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate infrastructure container topology
        run: docker compose -f docker/compose.yml config --quiet

      - name: Validate full container topology
        run: docker compose --env-file docker/.env.development.example -f docker/compose.yml -f docker/compose.app.yml config --quiet

      - name: Validate full container services
        run: |
          services="$(docker compose --env-file docker/.env.development.example -f docker/compose.yml -f docker/compose.app.yml config --services | sort | tr '\n' ' ')"
          test "$services" = "backend frontend minio postgres redis "

      - name: Validate isolated test container topology
        env:
          WORKSYNC_DOCKER_TEST_ENV_FILE: .env.test.example
        run: docker compose --project-name worksync-test --env-file docker/.env.test.example -f docker/compose.test.yml config --quiet

      - name: Validate isolated test container services
        env:
          WORKSYNC_DOCKER_TEST_ENV_FILE: .env.test.example
        run: |
          services="$(docker compose --project-name worksync-test --env-file docker/.env.test.example -f docker/compose.test.yml config --services | sort | tr '\n' ' ')"
          test "$services" = "backend-test frontend-e2e frontend-test migration-test minio postgres redis "

      - name: Validate Docker orchestration scripts
        run: |
          node --check scripts/docker-images.cjs
          node scripts/docker-test-self-test.cjs

      # Concurrent targets retain one shared builder/dependency graph. No
      # registry push or remote-cache export is required for PR validation.
      - name: Validate all image targets
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ci
          provenance: mode=max

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          npm_config_audit: "false"
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup pinned OSV-Scanner
        timeout-minutes: 2
        run: pnpm setup:audit

      - name: Self-test dependency audit gate
        run: pnpm test:audit-production

      - name: Audit production dependencies
        timeout-minutes: 3
        run: pnpm audit:production

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: test-results/dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
