name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-review-evidence:
    name: PR review evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Self-test PR evidence checker
        run: node scripts/pr-review-evidence-self-test.cjs

      - name: Check PR evidence
        run: node scripts/pr-review-evidence.cjs

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worksync_test
          POSTGRES_USER: worksync
          POSTGRES_PASSWORD: worksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksync -d worksync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://worksync:worksync@localhost:5432/worksync_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
      AUTH_RATE_LIMIT_ENABLED: "true"
      AUTH_RATE_LIMIT_KEY_SECRET: ci-rate-limit-secret-at-least-32-bytes
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm prisma:migrate:deploy:test

      - name: Validate backend
        run: pnpm validate:backend

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: app/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/frontend/**/*.[jt]s', 'app/frontend/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: pnpm validate:frontend

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worksync_test
          POSTGRES_USER: worksync
          POSTGRES_PASSWORD: worksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksync -d worksync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "false"
      DATABASE_URL: postgresql://worksync:worksync@localhost:5432/worksync_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @worksync/frontend exec playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: pnpm --filter @worksync/frontend test:e2e

      - name: Apply Prisma migrations for live auth E2E
        run: pnpm prisma:migrate:deploy:test

      - name: Run live auth concurrency end-to-end tests
        run: pnpm --filter @worksync/frontend test:e2e:live

  containers:
    name: Container topology and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate infrastructure container topology
        run: docker compose -f docker/compose.yml config --quiet

      - name: Validate full container topology
        run: docker compose --env-file docker/.env.development.example -f docker/compose.yml -f docker/compose.app.yml config --quiet

      - name: Validate full container services
        run: |
          services="$(docker compose --env-file docker/.env.development.example -f docker/compose.yml -f docker/compose.app.yml config --services | sort | tr '\n' ' ')"
          test "$services" = "backend frontend minio postgres redis "

      - name: Validate isolated test container topology
        env:
          WORKSYNC_DOCKER_TEST_ENV_FILE: .env.test.example
        run: docker compose --project-name worksync-test --env-file docker/.env.test.example -f docker/compose.test.yml config --quiet

      - name: Validate isolated test container services
        env:
          WORKSYNC_DOCKER_TEST_ENV_FILE: .env.test.example
        run: |
          services="$(docker compose --project-name worksync-test --env-file docker/.env.test.example -f docker/compose.test.yml config --services | sort | tr '\n' ' ')"
          test "$services" = "backend-test frontend-e2e frontend-test migration-test postgres redis "

      - name: Validate Docker orchestration scripts
        run: |
          node --check scripts/docker-images.cjs
          node scripts/docker-test-self-test.cjs

      # All targets share this job's ephemeral BuildKit cache. PR validation
      # has no downstream consumer for a daemon-loaded image or remote cache.
      - name: Validate backend image target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          tags: worksync-backend:ci
          outputs: type=cacheonly

      - name: Validate frontend image target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend
          tags: worksync-frontend:ci
          outputs: type=cacheonly
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
            NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=false

      - name: Validate test runner image target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-runner
          tags: worksync-test-runner:ci
          outputs: type=cacheonly

      - name: Validate Playwright test image target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-e2e
          tags: worksync-test-e2e:ci
          outputs: type=cacheonly

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
