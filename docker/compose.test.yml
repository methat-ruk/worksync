x-test-runner: &test-runner
  build:
    context: ..
    dockerfile: Dockerfile
    target: test-runner
  image: worksync-test-runner:local
  env_file:
    - ${WORKSYNC_DOCKER_TEST_ENV_FILE:-.env.test}
  environment:
    CI: "true"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${WORKSYNC_DOCKER_TEST_ENV_FILE:-.env.test}
    volumes:
      - worksync-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: worksync
      MINIO_ROOT_PASSWORD: worksync-local-secret
    volumes:
      - worksync-test-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration-test:
    <<: *test-runner
    command: ["corepack", "pnpm", "prisma:migrate:deploy:test"]
    depends_on:
      postgres:
        condition: service_healthy

  backend-test:
    <<: *test-runner
    command: ["corepack", "pnpm", "validate:backend"]
    environment:
      CI: "true"
      S3_REGION: us-east-1
      S3_BUCKET: worksync-test
      S3_ACCESS_KEY_ID: worksync
      S3_SECRET_ACCESS_KEY: worksync-local-secret
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend-test:
    <<: *test-runner
    command: ["corepack", "pnpm", "validate:frontend"]

  frontend-e2e:
    build:
      context: ..
      dockerfile: Dockerfile
      target: test-e2e
    image: worksync-test-e2e:local
    env_file:
      - ${WORKSYNC_DOCKER_TEST_ENV_FILE:-.env.test}
    environment:
      CI: "true"
    command: ["corepack", "pnpm", "test:e2e:frontend:all"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  worksync-test-postgres-data:
  worksync-test-minio-data:
